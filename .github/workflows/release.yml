name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test Seraphim.Engine.Tests/Seraphim.Engine.Tests.csproj --nologo --configuration Release
      - name: Pack
        shell: pwsh
        run: .\Pack-Seraphim.ps1
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path pack -Filter 'Seraphim-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'pack zip missing' }
          gh release create ${{ github.ref_name }} $zip.FullName --title "Seraphim ${{ github.ref_name }}" --notes "Windows workbench zip. Unsigned unless SERAPHIM_PFX was set in the pack environment. SmartScreen may warn. We do not fake a signature."
